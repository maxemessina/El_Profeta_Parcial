<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El Profeta - Noticias y actualidad." />
  <title>Contacto | El Profeta</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="../assets/favicon/profeta.png" type="image/png">
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <span>Lunes, 20 de Abril de 2026</span>
    <span>☀ 13°C</span>
  </div>

  <!-- HEADER -->
  <header>
    <h1>El Profeta</h1>
  </header>

  <!-- NAV -->
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="noticias.html">Últimas noticias</a>
    <a href="equipo.html">Equipo</a>
    <a href="contacto.html">Contacto</a>
  </nav>

  <main>

  <section class="principal">
    <div class="contenido">
      <h2>¡Dejanos tu mensaje!</h2>

      <form id="form-contacto" class="card contacto-form">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" rows="4" required></textarea>

        <div class="botones">
          <button type="submit">Enviar</button>
          <button type="reset">Borrar</button>
        </div>

      </form>

      <p id="mensaje-exito" style="display:none;">
        Mensaje enviado correctamente ✅
      </p>

    </div>
  </section>    
</main>
    <script src="../js/contacto.js"></script>
</body>
</html>
