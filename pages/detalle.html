<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles Noticia</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

    <header>
        <!--boton para que el usuario pueda volver a las noticias-->
        <a href="index.html" class="btn-volver">← Volver al inicio</a>
    </header>

    <main>
        <!--contiene lo principal de la noticia-->
        <article class="contenedor-detalle">
            
            <!--titulo de la noticia-->
            <h1 id="titulo-noticia">Cargando...</h1>

            <div class="info-extra">
                <span id="fecha-noticia"></span>
            </div>

            <!--imagen de la noticia-->
            <div class="contenedor-imagen">
                <img id="imagen-noticia" src="" alt="Imagen ilustrativa de la noticia">
            </div>

            <!--texto de la noticia-->
            <div id="cuerpo-noticia" class="texto-noticia">
                <p>Cargando el contenido...</p>
            </div>

        </article>
    </main>

    <script src="js/detalle.js"></script>
</body>
</html>
